# English emails. Each template has: subject, title, intro, button (optional, needs a link) and outro.
# {name} and {link} are replaced with the real values (HTML-escaped) when the email is built.
mail.brand=Jobly
mail.footer=You received this email because of activity on your Jobly account.

mail.VERIFY_EMAIL.subject=Verify your Jobly email
mail.VERIFY_EMAIL.title=Welcome to Jobly, {name}
mail.VERIFY_EMAIL.intro=Confirm your email address to activate your account. The link can be used once and expires after a short time.
mail.VERIFY_EMAIL.button=Verify my email
mail.VERIFY_EMAIL.outro=If you did not create this account, you can ignore this message.

mail.WELCOME.subject=Your Jobly account is ready
mail.WELCOME.title=You are all set, {name}
mail.WELCOME.intro=Your email is verified and you can sign in now.
mail.WELCOME.button=Sign in
mail.WELCOME.outro=Good luck!

mail.RESET_PASSWORD.subject=Reset your Jobly password
mail.RESET_PASSWORD.title=Password reset
mail.RESET_PASSWORD.intro=We received a request to reset your password. The link can be used once and expires after a short time.
mail.RESET_PASSWORD.button=Choose a new password
mail.RESET_PASSWORD.outro=If you did not ask for this, ignore this message. Your password stays the same.

mail.PASSWORD_CHANGED.subject=Your Jobly password was changed
mail.PASSWORD_CHANGED.title=Password changed
mail.PASSWORD_CHANGED.intro=The password of your account was just changed.
mail.PASSWORD_CHANGED.button=Reset password
mail.PASSWORD_CHANGED.outro=If this was not you, reset your password immediately.

mail.ACCOUNT_EXISTS.subject=You already have a Jobly account
mail.ACCOUNT_EXISTS.title=Welcome back, {name}
mail.ACCOUNT_EXISTS.intro=Someone tried to register with this email, but an account already exists. Sign in, or reset your password if you forgot it.
mail.ACCOUNT_EXISTS.button=Sign in
mail.ACCOUNT_EXISTS.outro=If it was not you, no action is needed.
